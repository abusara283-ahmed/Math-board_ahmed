name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install Capacitor
        run: npm ci

      - name: Copy the board into the Android project
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ../math-board.apk

      - name: Keep the APK with this run
        uses: actions/upload-artifact@v4
        with:
          name: math-board-apk
          path: math-board.apk

      - name: Publish as the latest download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: لوح الرياضيات - نسخة ${{ github.run_number }}
          body: |
            ملف التثبيت على أندرويد: math-board.apk
            حمّله من الأسفل ثم افتحه على الجهاز للتثبيت.
          files: math-board.apk
          make_latest: true
